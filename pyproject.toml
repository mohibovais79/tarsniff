[project]
name = "tarsniff"
version = "0.1.0"
description = "Check an npm package for malware before you install it, with a small fine-tuned Qwen model that runs locally."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "mohibovais79", email = "mohibovais79@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["tokenizers>=0.20"]

[project.optional-dependencies]
# training / evaluation scripts only (Apple Silicon)
train = ["mlx-lm>=0.32.2; python_version >= '3.11' and sys_platform == 'darwin'"]

[project.scripts]
tarsniff = "tarsniff:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
