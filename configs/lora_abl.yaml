# Token-budget ablation: identical settings for every budget (only data + max_seq_length change).
train: true
fine_tune_type: lora
batch_size: 1
iters: 600            # = 1 epoch over 600 train examples
num_layers: -1
grad_checkpoint: true
mask_prompt: true
learning_rate: 1e-4
steps_per_report: 50
steps_per_eval: 100000
val_batches: 1
save_every: 100000
seed: 0
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.0
